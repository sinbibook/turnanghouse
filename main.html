<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>제주 터낭하우스 펜션 - 숙소소개</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="제주 터낭하우스 펜션 - 숙소소개" />
  <meta property="og:description" content="월정리해수욕장 바로 앞에 위치한 제주 터낭하우스 펜션입니다. 오션뷰객실, 도보1분거리 편의점과 마트가 위치해있습니다." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2021/12/06/ysp4AEMYPIVK.jpg" />
  <meta property="og:url" content="https://turnanghouse.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="제주 터낭하우스 펜션 - 숙소소개" />
  <meta name="twitter:description" content="월정리해수욕장 바로 앞에 위치한 제주 터낭하우스 펜션입니다. 오션뷰객실, 도보1분거리 편의점과 마트가 위치해있습니다." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2021/12/06/ysp4AEMYPIVK.jpg" />
  <meta name="naver-site-verification" content="bca4add6329ed1a0afed24d2fa44d4970abaab5b" />
  <meta name="google-site-verification" content="6QMClxfk5doMFezKzcZr2aBpKm8mPLSU34hjE99Pksk" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- sub1_1: 원본 about.html(펜션소개)과 같은 규격.
             .about_txt_bnr 이미지/텍스트 폭이 35:65 가 된다.
             (view.html 의 sub1_2 는 60:40 이라 이미지가 눈에 띄게 넓다 — 실제 사이트는 about 쪽이다.
              맨 아래 큰 이미지 여백은 .sub_about 로 따로 잡는다) -->
        <section id="content" class="sub1_1 sub_about">
          <div class="sub_visual visual">
            <div class="visual_box">
              <div class="visual_txt">
                <div>
                  <strong>About</strong>
                  <p data-property-caption="{name} 소개"></p>
                </div>
              </div>
              <div class="visual_control">
                <div class="swiper-arw swiper-button-prev">←</div>
                <div class="swiper-pagination"></div>
                <div class="swiper-arw swiper-button-next">→</div>
              </div>
              <div class="swiper-container">
                <div class="swiper-wrapper" data-main-hero-slides></div>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cont">
            <div class="sub_title_box">
              <p data-main-lead></p>
              <h3 data-main-title></h3>
            </div>

            <!-- about[] 반복 — 매퍼가 블록마다 .about_txt_bnr + .about_img_bnr 한 세트를 만든다 -->
            <div data-main-about-blocks></div>

            <div class="wide_img inner" data-main-wide-img>
              <img src="data:," alt="" />
            </div>
          </div>
          <!--// sub_cont -->
        </section>
      </div>
      <!--// container -->
    </div>

    <!-- 푸터는 #wrap(max-width:1920px) 밖에 둔다 — 어두운 배경이 화면 폭을 꽉 채우도록 -->
    <div id="footer-wrap"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/main-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/main.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
